name: Run Selenium TestNG Suite

on:
  push:
    branches:
      - dev
  schedule:
    # Daily 12:00 AM IST = 18:30 UTC
    - cron: "30 18 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl gnupg tar

      # Chrome installation
      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      # Firefox installation
      - name: Install Firefox
        run: |
          FIREFOX_VERSION=131.0
          wget -O firefox.tar.bz2 "https://download.mozilla.org/?product=firefox-${FIREFOX_VERSION}&os=linux64&lang=en-US"
          tar xjf firefox.tar.bz2
          sudo mv firefox /opt/firefox
          if [ -L /usr/bin/firefox ]; then sudo rm /usr/bin/firefox; fi
          sudo ln -s /opt/firefox/firefox /usr/bin/firefox
          firefox --version

      # Edge installation
      - name: Install Microsoft Edge
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'
          sudo rm microsoft.gpg
          sudo apt update
          sudo apt install -y microsoft-edge-stable
          microsoft-edge --version

      # EdgeDriver installation with auto version detection
      - name: Install EdgeDriver
        run: |
          EDGE_VERSION=$(microsoft-edge --version | awk '{print $3}')
          echo "Detected Edge Version: $EDGE_VERSION"
          wget "https://msedgedriver.azureedge.net/${EDGE_VERSION}/edgedriver_linux64.zip"
          unzip edgedriver_linux64.zip
          sudo mv msedgedriver /usr/local/bin/
          msedgedriver --version

      # Run Chrome Tests
      - name: Run Chrome Tests
        run: mvn clean test -Dbrowser=chrome -Dheadless=true

      # Run Firefox Tests
      - name: Run Firefox Tests
        run: mvn clean test -Dbrowser=firefox -Dheadless=true

      # Run Edge Tests
      - name: Run Edge Tests
        run: mvn clean test -Dbrowser=edge -Dheadless=true

      # Upload Surefire Reports
      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
