name: Run Selenium TestNG Suite

on:
  push:
    branches:
      - dev
  schedule:
    # Daily 4:00 PM IST = 10:30 UTC
    - cron: "30 10 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl gnupg

          # ✅ Chrome
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

          # ✅ Firefox (fresh install with fix)
          FIREFOX_VERSION=131.0
          wget -O firefox.tar.bz2 "https://download.mozilla.org/?product=firefox-${FIREFOX_VERSION}&os=linux64&lang=en-US"
          tar xjf firefox.tar.bz2
          sudo mv firefox /opt/firefox
          if [ -L /usr/bin/firefox ]; then sudo rm /usr/bin/firefox; fi
          sudo ln -s /opt/firefox/firefox /usr/bin/firefox
          firefox --version

          # ✅ Edge
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo install -o root -g root -m 644 microsoft.gpg /etc/apt/trusted.gpg.d/
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list'
          sudo rm microsoft.gpg
          sudo apt update
          sudo apt install -y microsoft-edge-stable

      - name: Run TestNG Suite
        run: |
          mvn clean test -Dheadless=true

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
