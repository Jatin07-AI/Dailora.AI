name: Run Selenium Tests

on:
  push:
    branches:
      - dev
  schedule:
    # Roz raat 12:00 baje IST (18:30 UTC = 00:00 IST)
    - cron: "30 18 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]   # 👉 Edge comment kar diya for now (Ubuntu runner pe extra setup chahiye)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox

      - name: Run Tests on ${{ matrix.browser }}
        run: |
          mvn clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true
